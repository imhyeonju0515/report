<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --bg:#fff4ee; --card:#fffdfb; --text:#5a3e4b; --muted:#9a7d8c; --line:#ffd3df;
  --accent:#f0568a; --accent-soft:#ffe0ea; --cafe:#2fae8f; --food:#f08a3c; --chip:#ffeaf1;
  --on-accent:#fff; --sky:#ffe9b8; --shadow:rgba(240,86,138,.18);
}
:root[data-theme="dark"]{
  --bg:#2a2038; --card:#362a47; --text:#fbeaf3; --muted:#c3acca; --line:#54426b;
  --accent:#ff8fb3; --accent-soft:#4d3350; --cafe:#6fe0c3; --food:#ffae7a; --chip:#43355a;
  --on-accent:#2a2038; --sky:#4a3a5e; --shadow:rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a2038; --card:#362a47; --text:#fbeaf3; --muted:#c3acca; --line:#54426b;
    --accent:#ff8fb3; --accent-soft:#4d3350; --cafe:#6fe0c3; --food:#ffae7a; --chip:#43355a;
    --on-accent:#2a2038; --sky:#4a3a5e; --shadow:rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.5;padding-bottom:84px}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0;flex:1 1 auto}
h1 small{font-weight:400;color:var(--muted);font-size:.8rem;margin-left:6px}
input[type=search],select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
input[type=search]{flex:1 1 180px;min-width:0;max-width:300px}
button{font:inherit;color:var(--text);cursor:pointer}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:4px 12px;font-size:.85rem}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.count{color:var(--muted);font-size:.85rem;margin-left:auto}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,box-shadow .15s}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.meta{display:flex;gap:6px;align-items:center;font-size:.75rem}
.tag{padding:2px 8px;border-radius:999px;font-weight:600;color:#fff}
.tag.c{background:var(--cafe)} .tag.f{background:var(--food)}
.area{color:var(--muted)}
.score{margin-left:auto;font-weight:700;color:var(--accent)}
.card h2{font-size:1.05rem;margin:0}
.card p{margin:0;color:var(--muted);font-size:.9rem;flex:1}
.actions{display:flex;gap:8px;align-items:center}
.pick{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:7px;font-size:.9rem}
.card.sel .pick{background:var(--accent);color:#fff;border-color:var(--accent)}
.src{font-size:.85rem;color:var(--accent);text-decoration:none;padding:7px 10px;border:1px solid var(--line);border-radius:10px}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;z-index:20}
.bar .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar strong{color:var(--accent)}
.bar button{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:8px 14px}
.bar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar .sp{flex:1}
dialog{width:min(560px,calc(100vw - 24px));max-height:86vh;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:16px;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dlg-head h2{margin:0;font-size:1.1rem}
.stops{list-style:none;margin:0;padding:0}
.stop{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.stop .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.85rem}
.stop .info{flex:1;min-width:0}
.stop .info b{display:block}
.stop .info span{font-size:.8rem;color:var(--muted)}
.stop .info a{font-size:.8rem;color:var(--accent);margin-right:8px}
.stop .ctl button{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:4px 8px;margin-left:2px}
.stop .ctl button:disabled{opacity:.35;cursor:default}
.route-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.route-actions a,.route-actions button{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:8px 14px;text-decoration:none;color:var(--text);font-size:.9rem}
.route-actions a.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.note{font-size:.8rem;color:var(--muted);margin:10px 0 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- 귀여운 테마 ---- */
body{background-color:var(--bg);background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px);background-size:22px 22px}

.bar button.on,.bar #route{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
dialog{width:min(760px,calc(100vw - 24px));border:3px solid var(--line);border-radius:28px;box-shadow:0 12px 40px var(--shadow)}

#map{height:320px;border-radius:20px;border:3px solid var(--line);margin-bottom:10px;overflow:hidden;z-index:0}

#routeInfo{margin:0 0 8px;font-size:.9rem;color:var(--muted);min-height:1.3em}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

const KEY = "jejucafe.selected.v1";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let selected = new Set();
try { selected = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e){}
const saveSel = () => { try { localStorage.setItem(KEY, JSON.stringify([...selected])); } catch(e){} };

const state = {cat:"전체", area:"전체", q:"", sort:"score", onlySel:false};

function chips(el, values, key){
  el.innerHTML = values.map(v => `<button class="chip" data-v="${esc(v)}" aria-pressed="${state[key]===v}">${esc(v)}</button>`).join("");
  el.onclick = e => {
    const b = e.target.closest(".chip"); if(!b) return;
    state[key] = b.dataset.v;
    el.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.v === state[key]));
    render();
  };
}
chips($("catChips"), ["전체","카페","음식점"], "cat");
chips($("areaChips"), ["전체", ...AREAS], "area");
$("sub").textContent = REGION + " · " + D.length + "곳";

function render(){
  const q = state.q.trim().toLowerCase();
  let list = D.filter(d =>
    (state.cat==="전체" || d.category===state.cat) &&
    (state.area==="전체" || d.area===state.area) &&
    (!state.onlySel || selected.has(d.name)) &&
    (!q || (d.name + " " + d.description + " " + d.area).toLowerCase().includes(q)));
  const cmp = {
    score:(a,b)=>b.score-a.score || a.name.localeCompare(b.name,"ko"),
    name:(a,b)=>a.name.localeCompare(b.name,"ko"),
    area:(a,b)=>AREAS.indexOf(a.area)-AREAS.indexOf(b.area) || b.score-a.score
  }[state.sort];
  list.sort(cmp);
  $("count").textContent = list.length + "곳 표시";
  $("grid").innerHTML = list.length ? list.map(d => {
    const on = selected.has(d.name);
    return `<article class="card${on?" sel":""}">
      <div class="meta"><span class="tag ${d.category==="카페"?"c":"f"}">${d.category==="카페"?"☕":"🍴"} ${d.category}</span><span class="area">${esc(d.area)}</span><span class="score">★ ${d.score}</span></div>
      <h2>${esc(d.name)}</h2><p>${esc(d.description)}</p>
      <div class="actions"><button class="pick" data-n="${esc(d.name)}" aria-pressed="${on}">${on?"💖 담았어요":"🤍 담기"}</button>
      ${d.source ? `<a class="src" href="${esc(d.source)}" target="_blank" rel="noopener noreferrer">출처 ↗</a>` : ""}</div>
    </article>`;
  }).join("") : `<div class="empty">조건에 맞는 곳이 없어요.</div>`;
  $("selCount").textContent = selected.size;
  $("onlySel").classList.toggle("on", state.onlySel);
  $("onlySel").textContent = state.onlySel ? "전체 목록 보기" : "선택 목록 보기";
  if($("routeDlg").open) renderRoute();
}

// ---- 경로 ----
const SWEEP = ["제주시 연동·노형","제주시 원도심·공항","조천읍(함덕)","구좌읍","성산읍·우도면","표선면·남원읍","서귀포시내","중문·예래","안덕면","대정읍·모슬포","한림읍·한경면","애월읍"];
const q = s => encodeURIComponent("제주 " + s);
function gmapUrl(stops){
  if(stops.length === 1) return "https://www.google.com/maps/search/?api=1&query=" + q(stops[0].name);
  let u = "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=" + q(stops[0].name) + "&destination=" + q(stops[stops.length-1].name);
  if(stops.length > 2) u += "&waypoints=" + stops.slice(1,-1).map(s => q(s.name)).join("%7C");
  return u;
}
// ---- 지도 (Leaflet + OpenStreetMap, 도로 경로는 OSRM 공개 서버) ----
const CENTER = {"제주시 연동·노형":[33.488,126.484],"제주시 원도심·공항":[33.510,126.520],"애월읍":[33.462,126.330],"한림읍·한경면":[33.400,126.250],"조천읍(함덕)":[33.543,126.670],"구좌읍":[33.540,126.800],"성산읍·우도면":[33.440,126.900],"표선면·남원읍":[33.325,126.830],"서귀포시내":[33.250,126.560],"중문·예래":[33.250,126.420],"안덕면":[33.250,126.330],"대정읍·모슬포":[33.220,126.250]};
const COORDS = {/*COORDS*/};
function posOf(d){
  if(COORDS[d.name]) return {ll:COORDS[d.name], exact:true};
  const c = CENTER[d.area], k = D.indexOf(d), a = k * 2.399, r = 0.008 + (k % 5) * 0.003;
  return {ll:[c[0] + r * Math.sin(a), c[1] + r * Math.cos(a) * 1.2], exact:false};
}
let map, mapLayer, routeSeq = 0;
function drawMap(list){
  const el = $("map");
  if(typeof L === "undefined"){ el.hidden = false; el.innerHTML = `<div class="empty">지도를 불러오지 못했어요. 인터넷 연결을 확인해주세요.</div>`; return; }
  el.hidden = false;
  if(!map){
    map = L.map(el).setView([33.38, 126.55], 9);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {maxZoom:19, attribution:"Tiles © Esri — Esri, HERE, Garmin, OpenStreetMap contributors"}).addTo(map);
    mapLayer = L.layerGroup().addTo(map);
  }
  map.invalidateSize();
  mapLayer.clearLayers();
  const color = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#f0568a";
  const pts = list.map(posOf);
  pts.forEach((p, i) => L.marker(p.ll, {
    icon:L.divIcon({className:"pin" + (p.exact ? "" : " approx"), html:`<span>${i+1}</span>`, iconSize:[30,30], iconAnchor:[15,15]}),
    title:list[i].name
  }).bindTooltip(list[i].name + (p.exact ? "" : " (대략 위치)")).addTo(mapLayer));
  const info = $("routeInfo"), approx = pts.filter(p => !p.exact).length;
  const warn = approx ? ` · ${approx}곳은 정확한 좌표를 못 찾아 지역 중심 근처에 대략 표시했어요(점선 테두리)` : "";
  if(pts.length < 2){ map.setView(pts[0].ll, 12); info.textContent = "2곳 이상 담으면 경로가 선으로 표시돼요" + warn; return; }
  const latlngs = pts.map(p => p.ll);
  const straight = L.polyline(latlngs, {color, weight:4, dashArray:"8 8", opacity:.85}).addTo(mapLayer);
  map.fitBounds(L.latLngBounds(latlngs).pad(.2));
  info.textContent = "도로 경로 계산 중…" + warn;
  const seq = ++routeSeq;
  fetch("https://router.project-osrm.org/route/v1/driving/" + pts.map(p => p.ll[1] + "," + p.ll[0]).join(";") + "?overview=full&geometries=geojson")
    .then(r => r.json())
    .then(j => {
      if(seq !== routeSeq) return;
      const rt = j.routes && j.routes[0];
      if(!rt) throw 0;
      mapLayer.removeLayer(straight);
      L.geoJSON(rt.geometry, {style:{color, weight:5, opacity:.9}}).addTo(mapLayer);
      info.textContent = `🚗 자동차로 약 ${(rt.distance/1000).toFixed(1)}km · ${Math.round(rt.duration/60)}분` + warn;
    })
    .catch(() => { if(seq === routeSeq) info.textContent = "도로 경로를 못 불러와 직선으로 표시했어요" + warn; });
}

function renderRoute(){
  const list = [...selected].map(n => D.find(d => d.name === n)).filter(Boolean);
  if(!list.length){
    $("map").hidden = true; $("routeInfo").textContent = "";
    $("routeBody").innerHTML = `<div class="empty">먼저 가고 싶은 곳을 “담기” 해주세요.</div>`;
    return;
  }
  drawMap(list);
  const chunks = [];
  for(let i = 0; i < list.length; i += 9){ const c = list.slice(i, i + 10); if(c.length > 1 || !chunks.length) chunks.push(c); }
  const links = chunks.map((c, i) => `<a class="main" target="_blank" rel="noopener noreferrer" href="${gmapUrl(c)}">${chunks.length > 1 ? `구글 지도 경로 ${i+1}/${chunks.length}` : "구글 지도로 경로 열기"} ↗</a>`).join("");
  $("routeBody").innerHTML = `<ol class="stops">` + list.map((d, i) => `
    <li class="stop"><span class="no">${i+1}</span>
      <div class="info"><b>${esc(d.name)}</b><span>${d.category} · ${esc(d.area)}</span><br>
        <a target="_blank" rel="noopener noreferrer" href="https://map.kakao.com/?q=${q(d.name)}">카카오맵</a>
        <a target="_blank" rel="noopener noreferrer" href="https://map.naver.com/p/search/${q(d.name)}">네이버지도</a></div>
      <div class="ctl"><button data-act="up" data-i="${i}" aria-label="위로" ${i===0?"disabled":""}>▲</button><button data-act="down" data-i="${i}" aria-label="아래로" ${i===list.length-1?"disabled":""}>▼</button><button data-act="del" data-i="${i}" aria-label="삭제">✕</button></div>
    </li>`).join("") + `</ol>
    <div class="route-actions">${links}<button data-act="sweep">지역 순(시계방향) 정렬</button></div>
    <p class="note">순서대로 첫 곳이 출발지, 마지막 곳이 도착지로 지도에 열립니다. 이름으로 검색해 위치를 찾으므로 지도에서 장소가 맞는지 확인하세요. 구글 지도는 한 번에 최대 10곳이라 더 많으면 나눠서 엽니다.</p>`;
}
$("route").addEventListener("click", () => { $("routeDlg").showModal(); renderRoute(); });
$("routeClose").addEventListener("click", () => $("routeDlg").close());
$("routeDlg").addEventListener("click", e => { if(e.target === $("routeDlg")) $("routeDlg").close(); });
$("routeBody").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const arr = [...selected], i = +b.dataset.i;
  if(b.dataset.act === "up" && i > 0) [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
  else if(b.dataset.act === "down" && i < arr.length - 1) [arr[i+1], arr[i]] = [arr[i], arr[i+1]];
  else if(b.dataset.act === "del") arr.splice(i, 1);
  else if(b.dataset.act === "sweep"){
    const idx = n => SWEEP.indexOf(D.find(d => d.name === n).area);
    arr.sort((a, c) => idx(a) - idx(c));
  }
  selected = new Set(arr); saveSel(); render();
});

$("grid").addEventListener("click", e => {
  const b = e.target.closest(".pick"); if(!b) return;
  const n = b.dataset.n;
  selected.has(n) ? selected.delete(n) : selected.add(n);
  saveSel(); render();
});
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("onlySel").addEventListener("click", () => { state.onlySel = !state.onlySel; render(); });
$("clear").addEventListener("click", () => {
  selected.clear(); saveSel(); state.onlySel = false; render();
});

const root = document.documentElement;
try { const t = localStorage.getItem("jejucafe.theme"); if(t) root.dataset.theme = t; } catch(e){}
$("theme").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("jejucafe.theme", root.dataset.theme); } catch(e){}
});

render();
</script>
</body>
</html>
